spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/Journal_App?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    show-sql: true

app:
  cookie:
    secure: ${COOKIE_SECURE:false}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.projectbyPranayChavan: DEBUG
